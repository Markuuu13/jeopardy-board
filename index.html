<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    html, body {
      background: transparent !important;
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      overflow: hidden;
    }
    .scoreboard-container {
      display: flex;
      gap: 20px;
      padding: 10px;
      background: transparent !important;
    }
    .team-card {
      width: 180px;
      padding: 15px;
      border-radius: 20px;
      box-shadow: inset -4px -4px 0px rgba(0,0,0,0.2), 4px 4px 0px rgba(0,0,0,0.3);
      position: relative;
      color: white;
    }
    .card-red    { background-color: #f73c3c; }
    .card-green  { background-color: #5ce694; }
    .card-blue   { background-color: #5ca6f7; }
    .card-yellow { background-color: #f2c93f; }
    .team-header {
      font-size: 11px;
      border-bottom: 2px solid white;
      padding-bottom: 8px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .score {
      font-size: 32px;
      margin-left: 5px;
      display: inline-block;
    }
    .button-group {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
    }
    .btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid #573914;
      box-shadow: inset -2px -2px 0px rgba(0,0,0,0.2);
      padding: 0;
    }
    .btn-plus { background-color: #4bd693; color: #fff; }
    .btn-minus { background-color: #f55b3b; color: #fff; }
    .btn:active { transform: translateY(1px); box-shadow: none; }
  </style>
</head>
<body>

<div class="scoreboard-container">
  <!-- TEAM 1 -->
  <div class="team-card card-red">
    <div class="team-header">TEAM 1</div>
    <div class="score" id="score-1">0</div>
    <div class="button-group">
      <button class="btn btn-plus" onclick="updateScore(1, 100)">+</button>
      <button class="btn btn-minus" onclick="updateScore(1, -100)">-</button>
    </div>
  </div>
  <!-- TEAM 2 -->
  <div class="team-card card-green">
    <div class="team-header">TEAM 2</div>
    <div class="score" id="score-2">0</div>
    <div class="button-group">
      <button class="btn btn-plus" onclick="updateScore(2, 100)">+</button>
      <button class="btn btn-minus" onclick="updateScore(2, -100)">-</button>
    </div>
  </div>
  <!-- TEAM 3 -->
  <div class="team-card card-blue">
    <div class="team-header">TEAM 3</div>
    <div class="score" id="score-3">0</div>
    <div class="button-group">
      <button class="btn btn-plus" onclick="updateScore(3, 100)">+</button>
      <button class="btn btn-minus" onclick="updateScore(3, -100)">-</button>
    </div>
  </div>
  <!-- TEAM 4 -->
  <div class="team-card card-yellow">
    <div class="team-header">TEAM 4</div>
    <div class="score" id="score-4">0</div>
    <div class="button-group">
      <button class="btn btn-plus" onclick="updateScore(4, 100)">+</button>
      <button class="btn btn-minus" onclick="updateScore(4, -100)">-</button>
    </div>
  </div>
</div>

<script>
  const scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
  function updateScore(teamId, amount) {
    scores[teamId] += amount;
    if (scores[teamId] < 0) scores[teamId] = 0;
    document.getElementById(`score-${teamId}`).innerText = scores[teamId];
  }
</script>

</body>
</html>
